<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zentro</title>
    <script>
      // HashRouter handles all client-side routing via the hash fragment,
      // so any server-side 404 just redirects to the app root.
      // The hash fragment is never sent to the server, so deep links
      // like /zentro/#/dashboard work without any custom redirect logic.
      window.location.replace('/zentro/');
    </script>
  </head>
  <body></body>
</html>
